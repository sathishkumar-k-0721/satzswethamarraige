<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sathishkumar K &amp; Swetha M — Wedding Invitation</title>
  <meta name="description" content="You are warmly invited to the wedding of Sathishkumar K &amp; Swetha M — 18 June 2026, Karaikudi" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ══════════════════════════════════════════
       ENTRY PAGE — LOCAL ANIMATIONS
    ══════════════════════════════════════════ */

    /* ─── 3-D Card flip entrance ─── */
    .entry-card {
      animation: cardFlipIn 1.1s cubic-bezier(0.175,0.885,0.32,1.275) 0.3s both;
      transition: transform 0.12s ease, box-shadow 0.35s ease;
      transform-style: preserve-3d;
      will-change: transform;
    }
    @keyframes cardFlipIn {
      0%   { opacity:0; transform:perspective(1100px) rotateY(-90deg) scale(0.85); }
      60%  { opacity:1; transform:perspective(1100px) rotateY(6deg)   scale(1.02); }
      80%  {            transform:perspective(1100px) rotateY(-3deg)  scale(1);    }
      100% {            transform:perspective(1100px) rotateY(0deg)   scale(1);    }
    }

    /* ─── Individual letter bounce-in ─── */
    @keyframes letterDrop {
      0%   { opacity:0; transform:translateY(-55px) scale(0.4) rotate(-15deg); }
      55%  {            transform:translateY(8px)   scale(1.12) rotate(3deg);  }
      75%  {            transform:translateY(-4px)  scale(0.97) rotate(-1deg); }
      90%  {            transform:translateY(2px)   scale(1.02) rotate(0);     }
      100% { opacity:1; transform:translateY(0)     scale(1)    rotate(0);     }
    }

    /* ─── "weds" heartbeat ─── */
    @keyframes wedsBeat {
      0%,100% { transform:scale(1);    letter-spacing:4px; }
      18%     { transform:scale(1.20); letter-spacing:7px; }
      34%     { transform:scale(1);                        }
      50%     { transform:scale(1.12); letter-spacing:5px; }
      65%     { transform:scale(1);    letter-spacing:4px; }
    }
    .weds-beating {
      display: block;
      animation: wedsBeat 2.2s ease infinite;
    }

    /* ─── Name glow breath after settle ─── */
    @keyframes nameGlow {
      0%,100% { filter:drop-shadow(0 0 5px rgba(212,116,141,0.18)); }
      50%     { filter:drop-shadow(0 0 22px rgba(212,116,141,0.70))
                       drop-shadow(0 0 44px rgba(201,168,76,0.28)); }
    }
    .n-glowing { animation: nameGlow 2.8s ease infinite; }

    /* ─── Shooting star streak ─── */
    .shooting-star {
      position: fixed;
      height: 1.5px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.92),
        rgba(232,204,128,0.55),
        transparent);
      border-radius: 2px;
      pointer-events: none;
      z-index: 4;
      transform-origin: left center;
    }
    @keyframes shootStar {
      0%   { opacity:0; transform:rotate(var(--ang)) scaleX(0.1); }
      12%  { opacity:1; }
      100% { opacity:0; transform:rotate(var(--ang)) scaleX(1) translateX(260px); }
    }

    /* ─── Card hover glow ─── */
    .entry-card:hover {
      box-shadow:
        0 8px 60px rgba(212,116,141,0.18),
        0 0 120px rgba(201,168,76,0.08);
    }
  </style>
</head>
<body class="entry-page">

  <!-- Starfield -->
  <div class="star-field" id="star-field"></div>

  <!-- Canvas hearts & butterflies -->
  <canvas id="canvas"></canvas>

  <!-- Ambient blobs -->
  <div class="entry-blob entry-blob-1"></div>
  <div class="entry-blob entry-blob-2"></div>

  <!-- S&S logo watermark -->
  <img src="logo.png" class="entry-logo-bg" aria-hidden="true" />

  <!-- ═══════════════ ENTRY CARD ═══════════════ -->
  <main class="entry-card">
    <span class="c c-tl" aria-hidden="true"></span>
    <span class="c c-tr" aria-hidden="true"></span>
    <span class="c c-br" aria-hidden="true"></span>
    <span class="c c-bl" aria-hidden="true"></span>

    <div class="entry-card-inner">

      <span class="entry-chip">Wedding Invitation</span>

      <div class="entry-names" role="heading" aria-level="1" aria-label="Sathishkumar weds Swetha">
        <span class="n">Sathishkumar</span>
        <span class="n-and">— weds —</span>
        <span class="n">Swetha</span>
      </div>

      <div class="ornate-rule entry-rule" aria-hidden="true">
        <span class="rule-diamond">✦</span>
        <span class="rule-line"></span>
        <span class="rule-icon">♥</span>
        <span class="rule-line"></span>
        <span class="rule-diamond">✦</span>
      </div>

      <button
        class="enter-btn"
        onclick="openInvitation()"
        aria-label="Open Wedding Invitation"
      >
        <span>Open Our Invitation</span>
        <span class="btn-heart" aria-hidden="true">♥</span>
      </button>

    </div>
  </main>

  <!-- Transition overlay -->
  <div id="overlay" aria-hidden="true"></div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      initStars('star-field', 180);
      initParticles('canvas', 32);

      /* 1. Letter-by-letter name bounce */
      animateNameLetters();

      /* 2. "weds" heartbeat — starts after names are visible */
      setTimeout(function () {
        var weds = document.querySelector('.n-and');
        if (weds) weds.classList.add('weds-beating');
      }, 1700);

      /* 3. Mouse tilt — enabled only after card flip finishes (1.4 s) */
      setTimeout(initCardTilt, 1500);

      /* 4. Name glow pulse — starts after all letters have landed */
      setTimeout(function () {
        document.querySelectorAll('.entry-names .n').forEach(function (el) {
          el.classList.add('n-glowing');
        });
      }, 3000);

      /* 5. Shooting stars */
      setTimeout(spawnShootingStar, 800);
      setInterval(spawnShootingStar, 2600);
    });

    /* ── Letter bounce animation ── */
    function animateNameLetters() {
      var container = document.querySelector('.entry-names');

      /* Cancel the container CSS fade-in — letters handle their own reveal */
      container.style.cssText += ';animation:none;opacity:1;transform:none;';

      /* Hide connector initially; fade it in between the two name bursts */
      var connector = document.querySelector('.n-and');
      if (connector) {
        connector.style.opacity = '0';
        setTimeout(function () {
          connector.style.transition = 'opacity 0.55s ease';
          connector.style.opacity    = '1';
        }, 1700);
      }

      /* Split each name span into individual letter spans */
      var nameEls = container.querySelectorAll('.n');
      nameEls.forEach(function (nameEl, nameIdx) {
        var text = nameEl.textContent.trim();
        nameEl.innerHTML = '';
        /* Reset parent gradient-clip — each letter span will own its gradient */
        nameEl.style.animation          = 'none';
        nameEl.style.opacity            = '1';
        nameEl.style.transform          = 'none';
        nameEl.style.background         = 'none';
        nameEl.style.webkitTextFillColor = 'initial';

        text.split('').forEach(function (char, i) {
          var s     = document.createElement('span');
          var delay = (1.2 + nameIdx * 0.58 + i * 0.075).toFixed(3);
          /* Gradient applied directly to each span — visible once opacity animates to 1 */
          s.style.display                = 'inline-block';
          s.style.opacity                = '0';
          s.style.background             = 'linear-gradient(140deg,#fef6ee 0%,#ffdde8 40%,#e8cc80 100%)';
          s.style.webkitBackgroundClip   = 'text';
          s.style.backgroundClip         = 'text';
          s.style.webkitTextFillColor    = 'transparent';
          s.style.animation              = 'letterDrop 0.60s cubic-bezier(0.175,0.885,0.32,1.275) forwards';
          s.style.animationDelay         = delay + 's';
          s.textContent = char;
          nameEl.appendChild(s);
        });
      });
    }

    /* ── Mouse 3-D parallax tilt ── */
    function initCardTilt() {
      var card = document.querySelector('.entry-card');
      if (!card) return;

      /* Remove the CSS flip animation so our JS transform takes full control */
      card.style.animation = 'none';

      window.addEventListener('mousemove', function (e) {
        var r  = card.getBoundingClientRect();
        var dx = (e.clientX - (r.left + r.width  / 2)) / (r.width  / 2);
        var dy = (e.clientY - (r.top  + r.height / 2)) / (r.height / 2);
        dx = Math.max(-1, Math.min(1, dx));
        dy = Math.max(-1, Math.min(1, dy));

        card.style.transform = [
          'perspective(900px)',
          'rotateX(' + (-dy * 9) + 'deg)',
          'rotateY(' + ( dx * 9) + 'deg)',
          'translateZ(14px)',
        ].join(' ');
        card.style.boxShadow =
          '0 ' + (6 + dy * 14) + 'px ' +
          (40 + Math.abs(dx) * 26) + 'px rgba(212,116,141,0.22),' +
          '0 0 80px rgba(201,168,76,0.06)';
      });

      document.addEventListener('mouseleave', function () {
        card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) translateZ(0)';
        card.style.boxShadow = '';
      });
    }

    /* ── Shooting star ── */
    function spawnShootingStar() {
      var el  = document.createElement('div');
      var ang = (Math.random() * 28 + 10).toFixed(1);
      var len = Math.floor(Math.random() * 110 + 70);
      el.className = 'shooting-star';
      el.style.cssText += [
        'top:'   + (Math.random() * 60).toFixed(1) + '%',
        'left:'  + (Math.random() * 65).toFixed(1) + '%',
        'width:' + len + 'px',
        '--ang:' + ang + 'deg',
        'animation:shootStar 0.90s ease-out forwards',
      ].join(';');
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 1050);
    }

    /* ── Page transition ── */
    function openInvitation() {
      var btn = document.querySelector('.enter-btn');
      btn.style.pointerEvents = 'none';
      btn.querySelector('span').textContent = '✦  Entering  ✦';
      document.getElementById('overlay').classList.add('active');
      setTimeout(function () {
        window.location.href = 'invitation.html';
      }, 720);
    }
  </script>
</body>
</html>
